name: Gemini Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  gemini_chat:
    runs-on: ubuntu-latest
    # Runs when you comment with @gemini-cli on an Issue
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '@gemini-cli')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Configure Git user for automated commits
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # =========================================================================
          # ACTIVE GEMINI CLI MODELS (Uncomment ONLY ONE line below to run)
          # =========================================================================
          
          # 1. Gemini 3.5 Flash-Lite (Recommended right now since your 3.8 Flash hit limit!)
          #gemini --yolo --skip-trust --model gemini-3.5-flash-lite -p "${{ github.event.comment.body }}"
          
          # 2. Gemini 3.6 Flash (Direct stable alternative to 3.8 Flash with separate quota)
          gemini --yolo --skip-trust --model gemini-3.6-flash -p "${{ github.event.comment.body }}"
          
          # 3. Gemini 3.8 Flash (Flagship coding Flash model - use when quota resets)
          #gemini --yolo --skip-trust --model gemini-3.8-flash -p "${{ github.event.comment.body }}"
          
          # 4. Gemini 3.1 Flash-Lite (Ultra-lightweight backup for simple script/prompt edits)
          #gemini --yolo --skip-trust --model gemini-3.1-flash-lite -p "${{ github.event.comment.body }}"
          
          # 5. Gemini 3.1 Pro Preview (High reasoning, strict free-tier limit)
          #gemini --yolo --skip-trust --model gemini-3.1-pro-preview -p "${{ github.event.comment.body }}"
          
          # =========================================================================

          # Automatically commit and push any changes made by the AI agent
          git add -A
          git diff --cached --quiet || git commit -m "refactor: apply updates via @gemini-cli instruction"
          git push origin HEAD:${{ github.ref_name }}
