name: Gemini Assistant

on:
  issue_comment:
    types: [created]

jobs:
  gemini_chat:
    runs-on: ubuntu-latest
    # Only run if the comment mentions @gemini-cli and is posted on an Issue or Pull Request
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '@gemini-cli')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Configure Git user for automated commits
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # =====================================================================
          # AVAILABLE MODELS & LOWER VERSION OPTIONS (Uncomment ONLY ONE to use):
          # =====================================================================
          
          # Option 1: Current Flash Model (Standard fast option)
          # gemini --yolo --skip-trust --model gemini-3.8-flash -p "${{ github.event.comment.body }}"
          
          # Option 2: Flash-Lite Alias (Fastest lower tier model for simple tasks/higher limits)
          # gemini --yolo --skip-trust --model flash-lite -p "${{ github.event.comment.body }}"
          
          # Option 3: Previous Generation Flash (Lower version alternative if newer models hit limits)
          # gemini --yolo --skip-trust --model gemini-2.5-flash -p "${{ github.event.comment.body }}"
          
          # Option 4: Pro Model (Advanced reasoning, lower daily quota)
          gemini --yolo --skip-trust --model gemini-3.8-pro -p "${{ github.event.comment.body }}"

          # Automatically commit and push any changes made by the AI agent
          git add -A
          git diff --cached --quiet || git commit -m "refactor: apply updates via @gemini-cli instruction"
          git push origin HEAD:${{ github.ref_name }}
