name: Gemini Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  gemini_chat:
    runs-on: ubuntu-latest
    # Runs when you comment with @gemini-cli on an Issue
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '@gemini-cli')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run Gemini CLI Action
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_skip_trust: true
          model: "gemini-3.1-flash-lite"
