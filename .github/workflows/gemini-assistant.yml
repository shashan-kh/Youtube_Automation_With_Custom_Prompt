name: Gemini Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  gemini_chat:
    runs-on: ubuntu-latest
    # Runs when you comment with @gemini-cli on an Issue
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '@gemini-cli')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: true
        run: |
          # Configure Git user for automated commits
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run Gemini CLI with --skip-trust explicitly bypassing the workspace trust check
          gemini --yolo --skip-trust --model gemini-3.1-flash-lite -p "${{ github.event.comment.body }}"
          
          # Automatically commit and push any changes made by the AI agent
          git add -A
          git diff --cached --quiet || git commit -m "refactor: apply updates via @gemini-cli instruction"
          git push origin HEAD:${{ github.ref_name }}
